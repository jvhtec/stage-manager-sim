name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run budget:bundle
      - name: Generate historical balance report twice
        run: |
          HISTORY_OUT="$RUNNER_TEMP/balance-history-a" npm run balance:history
          HISTORY_OUT="$RUNNER_TEMP/balance-history-b" npm run balance:history
      - name: Verify historical balance report is deterministic
        run: |
          cmp "$RUNNER_TEMP/balance-history-a.md" "$RUNNER_TEMP/balance-history-b.md"
          cmp "$RUNNER_TEMP/balance-history-a.json" "$RUNNER_TEMP/balance-history-b.json"
      - name: Upload historical balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-history
          path: |
            ${{ runner.temp }}/balance-history-a.md
            ${{ runner.temp }}/balance-history-a.json
