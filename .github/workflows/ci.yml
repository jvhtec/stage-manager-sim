name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run budget:bundle
      - name: Regenerate historical balance report
        run: npm run balance:history
      - name: Upload regenerated historical balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-history
          path: |
            docs/balance-history.md
            docs/balance-history.json
      - name: Verify historical balance report
        run: git diff --exit-code -- docs/balance-history.md docs/balance-history.json
