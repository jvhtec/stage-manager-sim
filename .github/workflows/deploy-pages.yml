name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let in-flight runs finish rather than
# cancelling them mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # Provisions the repo's Pages site (build type "workflow") via the API
        # if it hasn't been enabled yet — without this, deploy-pages fails
        # with a 404 on the very first run since there's no Pages site to
        # deploy to.
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (GitHub Pages base path)
        run: npm run build:pages

      - name: Check bundle budget
        run: npm run budget:bundle

      - name: SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrites, so a direct link or
        # refresh on a route like /calendar 404s. Serving index.html for
        # any unmatched path lets react-router take over from there —
        # asset paths in it are already absolute (see vite.config.ts base),
        # so they resolve correctly regardless of how deep the URL is.
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
